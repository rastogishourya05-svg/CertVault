<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#547296" stroke-width="1.8"/></marker></defs><rect width="1920" height="1080" fill="#F7FAFF"/><text x="90" y="83" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563EB">CERTVAULT / MVP WORKFLOW</text><text x="90" y="145" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#173250">Flow of solution</text><text x="90" y="191" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526981">User-triggered Gmail discovery with controlled processing and private storage</text><text x="90" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">01  CONNECT</text><text x="690" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">02  DISCOVER &amp; CHECK</text><text x="1290" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">03  PROCESS &amp; ORGANIZE</text><rect x="90" y="300" width="480" height="150" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="112" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">AUTHENTICATION</text><text x="112" y="367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Sign in to CertVault</text><text x="112" y="400" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Supabase Auth establishes the user session</text><rect x="90" y="510" width="480" height="170" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="112" y="542" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">CONSENT</text><text x="112" y="577" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Connect test Gmail</text><text x="112" y="610" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">OAuth with read-only Gmail access</text><text x="112" y="637" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">User chooses a scan range</text><rect x="90" y="750" width="480" height="145" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="112" y="782" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">MANUAL ACTION</text><text x="112" y="817" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Select “Scan now”</text><text x="112" y="850" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">A scan job is queued for processing</text><rect x="690" y="300" width="480" height="170" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="712" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">DISCOVERY</text><text x="712" y="367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Find certificate PDFs</text><text x="712" y="400" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Supported subject wording + PDF attachment</text><text x="712" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">FastAPI → Redis / Celery</text><rect x="690" y="535" width="480" height="170" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="712" y="567" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">DOWNLOAD POLICY</text><text x="712" y="602" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Check size and approval</text><text x="712" y="635" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Reject above 50,000,000 bytes</text><text x="712" y="662" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Ask approval above the user threshold</text><rect x="1290" y="300" width="540" height="170" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="1312" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">FILE VALIDATION</text><text x="1312" y="367" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Scan and extract</text><text x="1312" y="400" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">ClamAV malware check → isolated PDF parser</text><text x="1312" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Extract metadata from PDF text</text><rect x="1290" y="535" width="540" height="170" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="1312" y="567" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">DUPLICATE CHECK</text><text x="1312" y="602" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Compare file-content hash</text><text x="1312" y="635" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">SHA-256 identifies an identical file</text><text x="1312" y="662" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Duplicate → skip another stored copy</text><rect x="1290" y="770" width="540" height="150" rx="16" fill="white" stroke="#CBDAED" stroke-width="2"/><text x="1312" y="802" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">PRIVATE VAULT</text><text x="1312" y="837" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173250">Save, search and retrieve</text><text x="1312" y="870" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Private Storage + PostgreSQL ownership rules</text><text x="1312" y="897" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Import activity → Search → View → Download</text><path d="M330 450 V510" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 680 V750" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 822 H625 V385 H690" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M930 470 V535" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1170 620 H1230 V385 H1290" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1190" y="525" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526981">Allowed / approved</text><path d="M1560 470 V535" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1560 705 V770" fill="none" stroke="#547296" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1580" y="744" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526981">New file</text><rect x="690" y="770" width="480" height="125" rx="16" fill="#EDF3FD"/><text x="712" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">CLEAR OUTCOMES</text><text x="712" y="838" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173250">Approval needed • Duplicate • Rejected</text><text x="712" y="869" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526981">Errors remain visible in import activity</text><text x="90" y="991" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526981">MVP scope: manual scans · PDF attachments · deterministic metadata extraction</text><text x="90" y="1030" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687C92">Implementation workflow shown. Successful live Gmail PDF import remains under verification.</text></svg>