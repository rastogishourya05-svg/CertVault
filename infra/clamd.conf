Foreground yes
# The upstream container entrypoint waits for this socket before supervising clamd.
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 5
MaxFiles 1000
AlertExceedsMax yes
ReadTimeout 60
CommandReadTimeout 30
MaxThreads 2
MaxQueue 8
